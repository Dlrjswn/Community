server:
  # Nginx/ALB 등 프록시가 넘긴 X-Forwarded-* 헤더 신뢰 (클라이언트 IP, HTTPS 등)
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 30

  data:
    redis:
      host: redis
      port: 6379
      # Redis 커맨드 타임아웃
      timeout: 2s
      lettuce:
        pool:
          # 연결 풀 사이즈 (부하에 맞게 조절 가능)
          max-active: 64
          max-idle: 16
          min-idle: 4

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
