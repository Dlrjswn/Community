name: Deploy to EC2 with Docker Compose

on:
  push:
    branches:
      - main
      - v1
      - v2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradlew 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Gradle 빌드 (테스트 제외)
      - name: Build JAR
        run: ./gradlew build -x test

      # 5. 브랜치명 변수 설정
      - name: Get branch name
        id: branch-info
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # 6. JAR 파일 이름 변경
      - name: Rename jar to app.jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" | head -n 1)
          mv "$JAR_FILE" "app.jar"

      # 7. JAR + Dockerfile + docker-compose.yml + .env 업로드
      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "app.jar,Dockerfile,docker-compose.yml,.env"
          target: "~/app/${{ steps.branch-info.outputs.branch_name }}"

      # 8. EC2에서 Docker Compose로 배포
      - name: Deploy using Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            BRANCH="${{ steps.branch-info.outputs.branch_name }}"
            APP_PATH=~/app/$BRANCH

            cd $APP_PATH

            echo "[INFO] Stop old containers"
            docker-compose down || true

            echo "[INFO] Build and start new containers"
            docker-compose up -d --build
