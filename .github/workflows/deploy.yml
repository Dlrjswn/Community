name: Deploy to EC2 with Docker Compose

on:
  push:
    branches: [ main, v1, v2 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCR push 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dlrjswn/community:latest
            ghcr.io/dlrjswn/community:${{ github.sha }}

      - name: Deploy on EC2 (pull & up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "v1" ]; then
              TARGET_DIR="/home/ubuntu/app/v1"
            else
              TARGET_DIR="/home/ubuntu/app/v2"   # main, v2는 v2 디렉터리로
            fi

            cd "$TARGET_DIR"
            docker compose pull
            docker compose up -d
            docker compose ps
