name: Deploy to EC2 with Docker Compose

on:
  push:
    branches: [ main, v1, v2 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dlrjswn/community:latest
            ghcr.io/dlrjswn/community:${{ github.sha }}

      - name: Deploy on EC2 (pull & up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "v1" ]; then
              TARGET_DIR="/home/ubuntu/app/v1"
            else
              TARGET_DIR="/home/ubuntu/app/v2"
            fi

            cd "$TARGET_DIR"

            # 1) 이전 컨테이너/로컬 이미지 정리 (로컬 v1-app/v2-app 잔재 제거)
            docker rm -f spring-app spring-app-v2 2>/dev/null || true
            docker rm -f redis redis-v2 2>/dev/null || true
            docker rmi -f v1-app v2-app 2>/dev/null || true
            docker compose down --remove-orphans || true

            # 2) 커밋 SHA 태그로 배포 (캐시 꼬임 방지)
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d

            # 3) 상태 출력
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
