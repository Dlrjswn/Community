name: Deploy to EC2

on:
  push:
    branches:
      - main
      - v1
      - v2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle (skip tests)
        run: ./gradlew build -x test

      # 5. 브랜치명과 JAR 이름 설정
      - name: Get branch info
        id: branch-info
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "jar_name=community-${BRANCH_NAME}.jar" >> $GITHUB_OUTPUT

      # 6. 빌드된 JAR 파일 이름 변경
      - name: Rename jar file dynamically
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" | head -n 1)
          mv "$JAR_FILE" "build/libs/${{ steps.branch-info.outputs.jar_name }}"

      # 7. EC2로 파일 전송
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/${{ steps.branch-info.outputs.jar_name }},.env"
          target: "~/app/${{ steps.branch-info.outputs.branch_name }}"

      # 8. EC2에서 컨테이너 재배포
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            BRANCH="${{ steps.branch-info.outputs.branch_name }}"
            JAR_NAME="${{ steps.branch-info.outputs.jar_name }}"
            CONTAINER_NAME="community-$BRANCH"

            echo "[INFO] Stop and remove old container"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "[INFO] Run new container"
            docker run -d --name $CONTAINER_NAME -p 8080:8080 \
              --env-file ~/app/$BRANCH/.env \
              -v ~/app/$BRANCH/$JAR_NAME:/app.jar \
              openjdk:17 java -jar /app.jar
